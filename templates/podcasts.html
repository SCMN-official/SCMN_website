<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البودكاستات - شبكة صناع الإبداع</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #000; color: #fff; margin: 0; padding: 0; }
        header { background: #111; padding: 13px; text-align: center; border-bottom: 3px solid #FFD700; }
        header h1 { color: #FFD700; margin: 0; }
        .logo { width: 120px; height: auto; margin-bottom: 10px; }
        nav { display: flex; justify-content: center; background: #1a1a1a; padding: 15px; flex-wrap: wrap; gap: 25px; }
        nav a { color: #fff; padding: 8px 14px; text-decoration: none; border-radius: 5px; transition: 0.2s; }
        nav a:hover { color: #FFD700; background: #222; }
        .container { max-width: 800px; margin: 20px auto; padding: 20px; background: #0d0d0d; border: 1px solid #FFD700; border-radius: 8px; }
        .container h2 { color: #FFD700; }
        footer { text-align: center; padding: 15px; background: #111; color: #FFD700; margin-top: 30px; }
        .social { display: flex; justify-content: center; gap: 20px; margin: 12px 0; }
        .social a { color: #FFD700; text-decoration: none; padding: 6px 12px; border: 1px solid #FFD700; border-radius: 5px; transition: 0.2s; }
        .social a:hover { background: #FFD700; color: #000; }
        .video { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 6px; cursor: pointer; }
        .video img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        .video .play { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 68px; height: 48px; background: rgba(0,0,0,0.7); border-radius: 10px; display: flex; align-items: center; justify-content: center; }
        .video .play::after { content: ""; border-left: 20px solid #FFD700; border-top: 12px solid transparent; border-bottom: 12px solid transparent; margin-left: 4px; }
        .video iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        .card { background: #0d0d0d; border: 1px solid #FFD700; border-radius: 8px; max-width: 800px; margin: 25px auto; padding: 15px; }
    </style>
</head>
<body>
    <header>
        <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" class="logo">
        <h1>البودكاستات</h1>
    </header>
    <nav>
        <a href="/">الرئيسية</a>
        <a href="/podcasts">البودكاستات</a>
        <a href="/summaries">الملخصات</a>
        <a href="/articles">قسم المحتوى المكتوب</a>
        <a href="/contact">اتصل بنا</a>
    </nav>
{% for ep in episodes %}
 <div class="card">
    <h2>{{ ep['title'] }}</h2>
    <div class="date">{{ ep['date'] }}</div>
    <div class="video" onclick="this.innerHTML='&lt;iframe src=\'https://www.youtube.com/embed/{{ ep['video_id'] }}?autoplay=1&cc_load_policy=1\' allowfullscreen&gt;&lt;/iframe&gt;'">
        <img src="https://img.youtube.com/vi/{{ ep['video_id'] }}/hqdefault.jpg" alt="thumbnail">
        <div class="play"></div>
    </div>
    <p>{{ ep['description'] | safe }}</p>
 </div>
{% endfor %}
    <footer>
        <p>صفحاتنا</p>
        <div class="social">
            <a href="https://youtube.com/@creativemakerscm24" target="_blank">يوتيوب</a>
            <a href="https://whatsapp.com/channel/0029Vaqj52zDeON9jRq0Yl0K" target="_blank">واتساب</a>
            <a href="https://www.facebook.com/profile.php?id=61568804985104" target="_blank">فيسبوك</a>
        </div>
        <p>&copy; 2026 جميع الحقوق محفوظة</p>
    </footer>
</body>
</html>
